[project]
name = "xadrez-treino-backend"
version = "0.1.0"
description = "Backend da Plataforma de Treino de Xadrez — domínio hexagonal + API FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",          # TestClient do FastAPI
    "pyyaml>=6.0",          # exportação da especificação OpenAPI
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
